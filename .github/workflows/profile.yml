# profile.timer — rebuilds every pane of the README every morning.
name: profile.timer

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/generate_profile.py, .github/workflows/profile.yml]

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: true

jobs:
  profile:
    name: profile.service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Render 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render fastfetch · shelf · timer panes
        run: python scripts/generate_profile.py
        env:
          GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}

      - name: Commit & Push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: profile.timer refresh"
          file_pattern: "assets/* profile-3d-contrib/*"
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
